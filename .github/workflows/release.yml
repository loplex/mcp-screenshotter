name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set project version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          mvn -B org.codehaus.mojo:versions-maven-plugin:set \
            -DnewVersion="${version}" -DgenerateBackupPoms=false

      # The packaging module's assembly (see packaging/pom.xml) already produces the flat-layout
      # release bundle as part of the ordinary Maven build: both jars side by side under their
      # fixed runtime names, plus README/CONTRIBUTING/LICENSE, exploded (no archive, no wrapper
      # directory) at packaging/target/mcp-screenshotter/. SandboxManager's worker-jar lookup
      # (Main.kt, resolveWorkerJar) checks for "mcp-screenshotter-worker.jar" next to its own jar
      # first, so `java -jar mcp-screenshotter-server.jar` works straight out of that directory
      # (or the tar.gz built from it below, once extracted), with no SCREENSHOTTER_WORKER_JAR
      # override.
      - name: Build (skip tests, already covered by CI on main)
        run: mvn -B clean package -DskipTests

      # Maven's output is deliberately version-agnostic (packaging/pom.xml) - this step is the
      # only place that knows the tag, so it builds the actual public archive from the exploded
      # output: a wrapper directory (so extracting it doesn't dump files into wherever the user
      # is) named after the tag, matching the convention users expect (e.g.
      # tar -xzf mcp-screenshotter-v0.2.0.tar.gz -> a mcp-screenshotter-v0.2.0/ directory).
      - name: Build release asset named after the tag
        run: |
          cp -r packaging/target/mcp-screenshotter "packaging/target/mcp-screenshotter-${GITHUB_REF_NAME}"
          tar -czf "mcp-screenshotter-${GITHUB_REF_NAME}.tar.gz" -C packaging/target "mcp-screenshotter-${GITHUB_REF_NAME}"

      # Uploaded as a plain workflow artifact (downloadable from this run's Actions page for
      # inspection), NOT published as a GitHub Release yet - that happens in the gated `publish`
      # job below.
      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcp-screenshotter-${{ github.ref_name }}
          path: mcp-screenshotter-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Gate: this job only runs after manual approval, PROVIDED the "release" environment has
    # "Required reviewers" configured in this repo's Settings -> Environments. That one-time
    # setup has to be done by hand in the GitHub UI - it can't be done from this workflow file.
    # Without it, this job runs immediately after `build`, same as before.
    environment: release
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: mcp-screenshotter-${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "mcp-screenshotter-${GITHUB_REF_NAME}.tar.gz"
