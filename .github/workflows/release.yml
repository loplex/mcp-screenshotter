name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release bundle (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # pom.xml pins project.build.outputTimestamp to ${git.commit.time}, populated by
      # git-commit-id-maven-plugin's initialize-phase execution - but that only happens inside a
      # normal lifecycle build. versions-maven-plugin:set below is invoked as a bare goal, which
      # never runs that plugin, so ${git.commit.time} is unresolved at that point; versions:set
      # then rewrites pom.xml with whatever it resolved to, freezing the *wall-clock time of this
      # step* into project.build.outputTimestamp instead of the commit time. Since the two matrix
      # legs run this step at slightly different real moments, each freezes a different value,
      # making every archive entry - and so server.jar/worker.jar themselves - byte-different
      # between the two release artifacts despite identical decompressed content. Computing it
      # once here via plain `git log` and passing it explicitly to both mvn invocations below
      # sidesteps versions:set's rewrite entirely: both legs build the same tag/commit, so both
      # get the exact same value.
      - name: Resolve reproducible-build timestamp from the last commit
        run: echo "SOURCE_DATE=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      - name: Set project version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          mvn -B org.codehaus.mojo:versions-maven-plugin:set \
            -DnewVersion="${version}" -DgenerateBackupPoms=false \
            -Dproject.build.outputTimestamp="${SOURCE_DATE}"

      # The packaging module's assembly (see packaging/pom.xml) already produces the flat-layout
      # release bundle as part of the ordinary Maven build: both jars side by side under their
      # fixed runtime names, plus README/CONTRIBUTING/LICENSE, exploded (no archive, no wrapper
      # directory) at packaging/target/mcp-screenshotter/. SandboxManager's worker-jar lookup
      # (Main.kt, resolveWorkerJar) checks for "mcp-screenshotter-worker.jar" next to its own jar
      # first, so `java -jar mcp-screenshotter-server.jar` works straight out of that directory
      # (or the tar.gz built from it below, once extracted), with no SCREENSHOTTER_WORKER_JAR
      # override.
      #
      # The linux-${{ matrix.arch }} profile (worker/pom.xml) trims org.openpnp:opencv's fat,
      # every-platform jar down to just the one native library this build actually runs on - see
      # the opencv.exclude.otherLinuxArch property doc there. Without it, the worker jar carries
      # >100MB of Windows/macOS/other-arch native code nu.pattern.OpenCV.loadLocally() can never
      # load on this JVM.
      - name: Build (skip tests, already covered by CI on main)
        run: |
          mvn -B clean package -DskipTests -Plinux-${{ matrix.arch }} \
            -Dproject.build.outputTimestamp="${SOURCE_DATE}"

      # Maven's output is deliberately version- and arch-agnostic (packaging/pom.xml) - this step
      # is the only place that knows the tag and which arch this matrix leg just built, so it
      # builds the actual public per-arch archive from the exploded output: a wrapper directory
      # (so extracting it doesn't dump files into wherever the user is) named after the tag and
      # arch, matching the convention users expect (e.g.
      # tar -xzf mcp-screenshotter-v0.2.0-linux-x86_64.tar.gz -> a
      # mcp-screenshotter-v0.2.0-linux-x86_64/ directory).
      - name: Build release asset named after the tag and architecture
        run: |
          name="mcp-screenshotter-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          cp -r packaging/target/mcp-screenshotter "packaging/target/${name}"
          tar -czf "${name}.tar.gz" -C packaging/target "${name}"

      # Uploaded as a plain workflow artifact (downloadable from this run's Actions page for
      # inspection), NOT published as a GitHub Release yet - that happens in the gated `publish`
      # job below.
      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcp-screenshotter-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: mcp-screenshotter-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Gate: this job only runs after manual approval, PROVIDED the "release" environment has
    # "Required reviewers" configured in this repo's Settings -> Environments. That one-time
    # setup has to be done by hand in the GitHub UI - it can't be done from this workflow file.
    # Without it, this job runs immediately after `build`, same as before.
    environment: release
    steps:
      # gh release create needs .git metadata to infer which repo to publish to.
      - uses: actions/checkout@v5

      # Both matrix legs' artifacts (one per arch) land in this one directory, flattened -
      # merge-multiple avoids nesting each under its own artifact-name subdirectory.
      - name: Download bundle artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mcp-screenshotter-${{ github.ref_name }}-linux-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            mcp-screenshotter-"${GITHUB_REF_NAME}"-linux-*.tar.gz
