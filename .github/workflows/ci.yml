name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B clean verify

  e2e:
    name: E2E (GUI sandbox)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Xephyr isn't installed here on purpose - the runner has no host X session for it to
      # attach to. SCREENSHOTTER_DISPLAY_BACKEND=xvfb below needs no host display at all.
      - name: Install sandbox runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 at-spi2-core bubblewrap python3-gi gir1.2-gtk-3.0

      # Ubuntu 24.04+ runner images restrict unprivileged user namespaces by default
      # (kernel.apparmor_restrict_unprivileged_userns=1), which makes bwrap fail with
      # "setting up uid map: Permission denied" before it ever launches the sandboxed app.
      - name: Allow unprivileged user namespaces (needed by bwrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Package (skip tests, already run in build-and-test)
        run: mvn -B clean package -DskipTests

      - name: Run E2E test
        env:
          SCREENSHOTTER_DISPLAY_BACKEND: xvfb
          SCREENSHOTTER_DEBUG: "1"
        run: python3 e2e/test_gui.py

      - name: Upload final screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-final-screenshot
          path: e2e/output/
          if-no-files-found: ignore
